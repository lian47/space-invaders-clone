<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Space Invaders Clone</title>

    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <section class="score-ui">
      <div>
        <span class="score">score: <span>0</span></span>
        <span class="level">level: <span>1</span></span>
        <span class="high">high: <span>0</span></span>
      </div>
    </section>

    <section class="start-screen screen">
      <div>
        <h1>Space Invaders</h1>
        <button class="button-play">play</button>
      </div>
    </section>

    <section class="game-over screen">
      <div>
        <h1>Game Over</h1>
        <button class="button-restart">Restart</button>
      </div>
    </section>

    <canvas>Seu navegador não suporta o elemento canvas.</canvas>

    <script type="module" src="./src/js/game.js"></script>
  </body>
</html>
